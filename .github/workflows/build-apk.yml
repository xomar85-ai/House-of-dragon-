name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: Arrange files
        run: |
          mkdir -p www/icons assets
          cp index.html manifest.json sw.js www/
          cp icon-192.png icon-512.png icon.svg www/icons/
          cp icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/
      - run: npm install
      - run: npx cap add android
      - run: npm run icons
        continue-on-error: true
      - name: Enable native printing
        run: |
          APP=$(node -p "require('./capacitor.config.json').appId")
          DIR=android/app/src/main/java/$(echo $APP | tr . /)
          cat > $DIR/MainActivity.java <<JAVA
          package $APP;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              final WebView w = getBridge().getWebView();
              w.addJavascriptInterface(new Object() {
                @JavascriptInterface
                public void print() {
                  runOnUiThread(new Runnable() { public void run() {
                    PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                    pm.print("House Design", w.createPrintDocumentAdapter("House Design"), new PrintAttributes.Builder().build());
                  }});
                }
              }, "AndroidPrint");
            }
          }
          JAVA
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: House-Design-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
